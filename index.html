<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

// ---------- データ定義 ----------
const MEMBERS = [
  { key: "oto", label: "おと", colorName: "紫", emoji: "🎧", accent: "#A98CDB", accentSoft: "#EDE5FB", text: "#5B3E9E" },
  { key: "shima", label: "しま", colorName: "青", emoji: "🍊", accent: "#6FB3EE", accentSoft: "#E4F1FC", text: "#2C6BA0" },
  { key: "gento", label: "げんと", colorName: "赤", emoji: "🍖", accent: "#EE8A9A", accentSoft: "#FCE6E9", text: "#B23D52" },
  { key: "tora", label: "とら", colorName: "緑", emoji: "🐯", accent: "#7FCB9A", accentSoft: "#E6F7EC", text: "#2F7D50" },
  { key: "shun", label: "しゅん", colorName: "黄", emoji: "⚡️", accent: "#E9C24A", accentSoft: "#FDF6DE", text: "#8F6F10" },
  { key: "kakeru", label: "かける", colorName: "水", emoji: "🐬", accent: "#5DC3D1", accentSoft: "#E1F6F8", text: "#1E7D8C" },
  { key: "komugi", label: "こむぎ", colorName: "桃", emoji: "🦋", accent: "#EE93BC", accentSoft: "#FCE9F1", text: "#B5477E" },
];

const DEFAULT_THEME = { accent: "#FF9FB8", accentSoft: "#FFF1F5", text: "#C24A6E" };

const TABS = [
  { key: "home", label: "ホーム", emoji: "🏠" },
  { key: "search", label: "検索", emoji: "🔍" },
  ...MEMBERS.map((m) => ({ key: m.key, label: m.label, emoji: m.emoji, member: m })),
  { key: "trades", label: "本日の取引", emoji: "🔄" },
  { key: "confirmed", label: "確定", emoji: "📝" },
  { key: "io", label: "データ管理", emoji: "💾" },
];

const getTheme = (tabKey) => {
  const m = MEMBERS.find((mm) => mm.key === tabKey);
  return m || DEFAULT_THEME;
};

const PAGE_SIZE = 20;
const STORAGE_KEY = "pose-tracker-records";

// ---------- 文字列類似度（あいまい検索用） ----------
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
    }
  }
  return dp[m][n];
}
function similarity(a, b) {
  const dist = levenshtein(a, b);
  const maxLen = Math.max(a.length, b.length, 1);
  return 1 - dist / maxLen;
}
function getSuggestions(input, allNames) {
  const q = input.trim().toLowerCase();
  if (!q) return [];
  return allNames
    .filter((n) => n.toLowerCase() !== q)
    .map((n) => ({ name: n, score: similarity(q, n.toLowerCase()), includes: n.toLowerCase().includes(q) }))
    .filter((x) => x.score > 0.35 || x.includes)
    .sort((a, b) => (b.includes - a.includes) || b.score - a.score)
    .slice(0, 5)
    .map((x) => x.name);
}
function makeId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function formatRecordForCopy(record) {
  const member = MEMBERS.find((m) => m.key === record.member);
  const lines = [
    `【${member ? member.label : record.member}】${record.poseName}`,
    `ユーザー名: ${record.userName || "-"}`,
    `名前: ${record.name || "-"}`,
    `実績: ${record.hasAchievement ? "あり" : "なし"}`,
    `危険フラグ: ${record.dangerFlag ? "あり" : "なし"}`,
    `友達フラグ: ${record.friendFlag ? "あり" : "なし"}`,
    `FFフラグ: ${record.ffFlag ? "あり" : "なし"}`,
    `他界: ${record.deceased ? "あり" : "なし"}`,
  ];
  if (record.notes) lines.push(`備考: ${record.notes}`);
  return lines.join("\n");
}

// ---------- ローカル保存 ----------
function loadRecords() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    console.error("読み込みに失敗しました", e);
    return [];
  }
}
function saveRecords(records) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  } catch (e) {
    console.error("保存に失敗しました", e);
  }
}

const TRADES_STORAGE_KEY = "pose-tracker-trades-today";
function loadTrades() {
  try {
    const raw = localStorage.getItem(TRADES_STORAGE_KEY);
    if (!raw) return { got: [], want: [], confirmed: [], done: [] };
    const parsed = JSON.parse(raw);
    return {
      got: Array.isArray(parsed.got) ? parsed.got : [],
      want: Array.isArray(parsed.want) ? parsed.want : [],
      confirmed: Array.isArray(parsed.confirmed) ? parsed.confirmed : [],
      done: Array.isArray(parsed.done) ? parsed.done : [],
    };
  } catch (e) {
    console.error("読み込みに失敗しました", e);
    return { got: [], want: [], confirmed: [], done: [] };
  }
}
function saveTrades(trades) {
  try {
    localStorage.setItem(TRADES_STORAGE_KEY, JSON.stringify(trades));
  } catch (e) {
    console.error("保存に失敗しました", e);
  }
}

const ARCHIVES_STORAGE_KEY = "pose-tracker-trade-archives";
function loadArchives() {
  try {
    const raw = localStorage.getItem(ARCHIVES_STORAGE_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    console.error("読み込みに失敗しました", e);
    return [];
  }
}
function saveArchives(archives) {
  try {
    localStorage.setItem(ARCHIVES_STORAGE_KEY, JSON.stringify(archives));
  } catch (e) {
    console.error("保存に失敗しました", e);
  }
}

function formatConfirmLabel(origin, confirm) {
  if (!confirm) return null;
  if (confirm.mode === "exchange") {
    const m = MEMBERS.find((mm) => mm.key === confirm.member);
    return `交換: ${m ? m.colorName : ""} ${confirm.poseName}`;
  }
  if (confirm.mode === "price") {
    return origin === "got" ? `譲: +${confirm.amount}枚` : `買取: +${confirm.amount}枚`;
  }
  return null;
}

const PAIR_COLORS = ["#F59E0B", "#10B981", "#3B82F6", "#EC4899", "#8B5CF6", "#EF4444", "#14B8A6", "#F97316"];
function getPairColor(pairId) {
  let hash = 0;
  for (let i = 0; i < pairId.length; i++) hash = (hash * 31 + pairId.charCodeAt(i)) >>> 0;
  return PAIR_COLORS[hash % PAIR_COLORS.length];
}

// ---------- 小さな共通パーツ ----------
function EmptyState({ text }) {
  return (
    <div className="empty-state">
      <div className="empty-emoji">🎀</div>
      <p className="empty-text">{text}</p>
    </div>
  );
}

function Pagination({ page, setPage, totalItems }) {
  const totalPages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));
  if (totalPages <= 1) return null;
  return (
    <div className="pagination">
      <button disabled={page <= 1} onClick={() => setPage((p) => Math.max(1, p - 1))} className="page-btn">＜</button>
      <span className="page-label">{page} / {totalPages}</span>
      <button disabled={page >= totalPages} onClick={() => setPage((p) => Math.min(totalPages, p + 1))} className="page-btn">＞</button>
    </div>
  );
}

function CopyUserNameButton({ userName }) {
  const [copied, setCopied] = useState(false);
  if (!userName) return null;
  const handleClick = async (e) => {
    e.stopPropagation();
    try {
      await navigator.clipboard.writeText(userName);
      setCopied(true);
      setTimeout(() => setCopied(false), 1200);
    } catch (err) {
      alert("コピーに失敗しました");
    }
  };
  return (
    <button type="button" onClick={handleClick} className="copy-username-btn" title="ユーザー名をコピー">
      {copied ? "✅" : "📋"}
    </button>
  );
}

function RecordCard({ record, onDelete, onEdit, onDuplicate }) {
  const member = MEMBERS.find((m) => m.key === record.member) || MEMBERS[0];
  const deceased = record.deceased;
  const [copied, setCopied] = useState(false);

  const handleCopy = () => {
    onDuplicate(record);
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  };

  return (
    <div
      className={`record-card${deceased ? " record-card--deceased" : ""}`}
      style={!deceased ? { borderColor: member.accentSoft } : {}}
    >
      <div className="record-card-inner">
        <div className="record-main">
          <div className="badge-row">
            <span className="badge" style={{ background: deceased ? "#9CA3AF" : member.accent }}>
              {member.emoji} {member.label}
            </span>
            {record.hasAchievement && <span className="badge badge-achieve">🏆 実績あり</span>}
            {record.dangerFlag && <span className="badge badge-danger">⚠️ 危険</span>}
            {record.friendFlag && <span className="badge badge-friend">🤝 友達</span>}
            {record.ffFlag && <span className="badge badge-ff">🔁 FF</span>}
            {deceased && <span className="badge badge-deceased">🕊️ 他界</span>}
          </div>
          <div className="pose-line">
            <span className="pose-name" style={{ color: deceased ? "#6B7280" : member.text, fontFamily: "'M PLUS Rounded 1c', sans-serif" }}>
              {record.poseName}
            </span>
            <span className="pose-meta-inline">👤{record.userName || "-"}<CopyUserNameButton userName={record.userName} /> ／ 📛{record.name || "-"}</span>
          </div>
          {record.notes && <div className="notes-line">📝 {record.notes}</div>}
        </div>
        <div className="record-actions">
          <button onClick={handleCopy} className="btn-copy">{copied ? "✅ 複製済" : "📋 コピー"}</button>
          <button onClick={() => onEdit(record)} className="btn-edit">編集</button>
          <button onClick={() => onDelete(record.id)} className="btn-delete">削除</button>
        </div>
      </div>
    </div>
  );
}

function RecordFormModal({ initial, onSave, onCancel, allPoseNames }) {
  const [member, setMember] = useState(initial?.member || MEMBERS[0].key);
  const [poseName, setPoseName] = useState(initial?.poseName || "");
  const [userName, setUserName] = useState(initial?.userName || "");
  const [name, setName] = useState(initial?.name || "");
  const [hasAchievement, setHasAchievement] = useState(initial?.hasAchievement || false);
  const [dangerFlag, setDangerFlag] = useState(initial?.dangerFlag || false);
  const [friendFlag, setFriendFlag] = useState(initial?.friendFlag || false);
  const [ffFlag, setFfFlag] = useState(initial?.ffFlag || false);
  const [notes, setNotes] = useState(initial?.notes || "");
  const [deceased, setDeceased] = useState(initial?.deceased || false);
  const [showSuggestions, setShowSuggestions] = useState(false);

  const suggestions = useMemo(() => getSuggestions(poseName, allPoseNames), [poseName, allPoseNames]);
  const theme = MEMBERS.find((m) => m.key === member);

  const handleSubmit = () => {
    if (!poseName.trim()) {
      alert("ポーズ名を入力してください");
      return;
    }
    onSave({
      id: initial?.id,
      member,
      poseName: poseName.trim(),
      userName: userName.trim(),
      name: name.trim(),
      hasAchievement,
      dangerFlag,
      friendFlag,
      ffFlag,
      notes: notes.trim(),
      deceased,
    });
  };

  return (
    <div className="modal-overlay">
      <div className="modal-card">
        <h2 className="modal-title" style={{ fontFamily: "'M PLUS Rounded 1c', sans-serif", color: theme.text }}>
          {initial ? "編集する ✏️" : "あたらしく登録 ✨"}
        </h2>

        <label className="form-label">メンバー</label>
        <select value={member} onChange={(e) => setMember(e.target.value)} className="form-select" style={{ borderColor: theme.accentSoft }}>
          {MEMBERS.map((m) => (
            <option key={m.key} value={m.key}>{m.emoji} {m.label}（{m.colorName}）</option>
          ))}
        </select>

        <label className="form-label">ポーズ名</label>
        <input
          value={poseName}
          onChange={(e) => { setPoseName(e.target.value); setShowSuggestions(true); }}
          onFocus={() => setShowSuggestions(true)}
          placeholder="例：キラキラポーズ"
          className="form-input"
          style={{ borderColor: theme.accentSoft, marginBottom: "0.2rem" }}
        />
        <div className="suggestions-wrap">
          {showSuggestions && suggestions.length > 0 && (
            <div className="suggestion-list">
              <span className="suggestion-hint">似ているポーズ名：</span>
              {suggestions.map((s) => (
                <button
                  key={s}
                  type="button"
                  onClick={() => { setPoseName(s); setShowSuggestions(false); }}
                  className="suggestion-chip"
                  style={{ background: theme.accentSoft, color: theme.text }}
                >
                  {s}
                </button>
              ))}
            </div>
          )}
        </div>

        <label className="form-label">ユーザー名</label>
        <input value={userName} onChange={(e) => setUserName(e.target.value)} className="form-input" style={{ borderColor: theme.accentSoft }} />

        <label className="form-label">名前</label>
        <input value={name} onChange={(e) => setName(e.target.value)} className="form-input" style={{ borderColor: theme.accentSoft }} />

        <div className="checkbox-row">
          <label className="checkbox-label">
            <input type="checkbox" checked={hasAchievement} onChange={(e) => setHasAchievement(e.target.checked)} />
            🏆 実績あり
          </label>
          <label className="checkbox-label">
            <input type="checkbox" checked={dangerFlag} onChange={(e) => setDangerFlag(e.target.checked)} />
            ⚠️ 危険フラグ
          </label>
        </div>

        <div className="checkbox-row">
          <label className="checkbox-label">
            <input type="checkbox" checked={friendFlag} onChange={(e) => setFriendFlag(e.target.checked)} />
            🤝 友達フラグ
          </label>
          <label className="checkbox-label">
            <input type="checkbox" checked={ffFlag} onChange={(e) => setFfFlag(e.target.checked)} />
            🔁 FFフラグ
          </label>
        </div>

        <label className="form-label">備考欄</label>
        <textarea value={notes} onChange={(e) => setNotes(e.target.value)} rows={3} className="form-textarea" style={{ borderColor: theme.accentSoft }} />

        <label className="checkbox-label" style={{ marginBottom: "1.1rem" }}>
          <input type="checkbox" checked={deceased} onChange={(e) => setDeceased(e.target.checked)} />
          🕊️ 他界フラグ
        </label>

        <div className="modal-actions">
          <button onClick={onCancel} className="btn-secondary">キャンセル</button>
          <button onClick={handleSubmit} className="btn-save" style={{ background: theme.accent }}>保存する</button>
        </div>
      </div>
    </div>
  );
}

function HomeTab({ records, onDelete, onEdit, onDuplicate, onAddClick }) {
  const [page, setPage] = useState(1);
  const sorted = useMemo(() => [...records].sort((a, b) => b.createdAt - a.createdAt), [records]);
  const pageItems = sorted.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
  return (
    <div>
      <div className="flex-between">
        <div>
          <h2 className="section-title" style={{ fontFamily: "'M PLUS Rounded 1c', sans-serif", color: DEFAULT_THEME.text }}>ホーム 🏠</h2>
          <p className="section-sub">ぜんぶで {records.length} けん</p>
        </div>
        <button onClick={onAddClick} className="btn-primary" style={{ background: DEFAULT_THEME.accent }}>＋ とうろく</button>
      </div>
      {sorted.length === 0 && <EmptyState text="まだデータがありません。「＋ とうろく」から追加してね！" />}
      {pageItems.map((r) => <RecordCard key={r.id} record={r} onDelete={onDelete} onEdit={onEdit} onDuplicate={onDuplicate} />)}
      <Pagination page={page} setPage={setPage} totalItems={sorted.length} />
    </div>
  );
}

function SearchTab({ records, onDelete, onEdit, onDuplicate }) {
  const [member, setMember] = useState("");
  const [pose, setPose] = useState("");
  const [excludeFriend, setExcludeFriend] = useState(false);
  const [excludeFF, setExcludeFF] = useState(false);
  const [dangerOnly, setDangerOnly] = useState(false);
  const [page, setPage] = useState(1);
  useEffect(() => { setPage(1); }, [member, pose, excludeFriend, excludeFF, dangerOnly]);
  const filtered = useMemo(
    () => records
      .filter((r) => (!member || r.member === member))
      .filter((r) => !pose.trim() || r.poseName.toLowerCase().includes(pose.trim().toLowerCase()))
      .filter((r) => !excludeFriend || !r.friendFlag)
      .filter((r) => !excludeFF || !r.ffFlag)
      .filter((r) => !dangerOnly || r.dangerFlag)
      .sort((a, b) => b.createdAt - a.createdAt),
    [records, member, pose, excludeFriend, excludeFF, dangerOnly]
  );
  const pageItems = filtered.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
  return (
    <div>
      <h2 className="section-title" style={{ fontFamily: "'M PLUS Rounded 1c', sans-serif", color: DEFAULT_THEME.text, marginBottom: "0.85rem" }}>検索 🔍</h2>
      <div className="filter-card">
        <div>
          <label className="form-label">メンバー（任意）</label>
          <select value={member} onChange={(e) => setMember(e.target.value)} className="form-select" style={{ borderColor: DEFAULT_THEME.accentSoft, marginBottom: 0 }}>
            <option value="">すべて</option>
            {MEMBERS.map((m) => <option key={m.key} value={m.key}>{m.emoji} {m.label}（{m.colorName}）</option>)}
          </select>
        </div>
        <div>
          <label className="form-label">ポーズ名（自由入力）</label>
          <input value={pose} onChange={(e) => setPose(e.target.value)} placeholder="キーワードを入力" className="form-input" style={{ borderColor: DEFAULT_THEME.accentSoft, marginBottom: 0 }} />
        </div>
        <div>
          <label className="form-label">絞り込み</label>
          <div className="filter-toggle-row">
            <button type="button" onClick={() => setExcludeFriend((v) => !v)} className={`filter-toggle${excludeFriend ? " active" : ""}`}>🤝 友達を除く</button>
            <button type="button" onClick={() => setExcludeFF((v) => !v)} className={`filter-toggle${excludeFF ? " active" : ""}`}>🔁 FFを除く</button>
            <button type="button" onClick={() => setDangerOnly((v) => !v)} className={`filter-toggle${dangerOnly ? " active-danger" : ""}`}>⚠️ 危険のみ表示</button>
          </div>
        </div>
      </div>
      <p className="section-sub" style={{ marginBottom: "0.5rem" }}>{filtered.length} けん ヒット</p>

      <Pagination page={page} setPage={setPage} totalItems={filtered.length} />
    </div>
  );
}

function IOTab({ records, onImport, onClearAll, archives }) {
  const [message, setMessage] = useState("");
  const [exportMember, setExportMember] = useState(MEMBERS[0].key);
  const [selectedArchiveIds, setSelectedArchiveIds] = useState([]);
  const fileRef = useRef(null);

  const downloadJson = (data, filenameSuffix) => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    const now = new Date();
    const dateStr = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, "0")}${String(now.getDate()).padStart(2, "0")}`;
    a.download = `pose-data-${dateStr}${filenameSuffix ? "-" + filenameSuffix : ""}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const handleExport = () => {
    downloadJson(records, "");
    setMessage("✅ エクスポートしました！");
  };

  const handleExportByMember = () => {
    const memberConfig = MEMBERS.find((m) => m.key === exportMember);
    const filtered = records.filter((r) => r.member === exportMember);
    if (filtered.length === 0) {
      setMessage(`⚠️ ${memberConfig.label}のデータがありません`);
      return;
    }
    downloadJson(filtered, memberConfig.label);
    setMessage(`✅ ${memberConfig.label}のデータ（${filtered.length}けん）をエクスポートしました！`);
  };

  const toggleArchiveSelection = (id) => {
    setSelectedArchiveIds((prev) => (prev.includes(id) ? prev.filter((i) => i !== id) : [...prev, id]));
  };

  const handleExportArchives = () => {
    const selected = archives.filter((a) => selectedArchiveIds.includes(a.id));
    if (selected.length === 0) {
      setMessage("⚠️ エクスポートする取引を選んでください");
      return;
    }
    downloadJson(selected, "取引");
    setMessage(`✅ 保存した取引（${selected.length}件）をエクスポートしました！`);
  };

  const handleFileChange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!Array.isArray(data)) throw new Error("形式エラー");

        let working = [...records];
        let addedCount = 0;
        let updatedCount = 0;
        let unchangedCount = 0;

        data.forEach((d) => {
          const normalized = {
            member: MEMBERS.some((m) => m.key === d.member) ? d.member : MEMBERS[0].key,
            poseName: d.poseName || "",
            userName: d.userName || "",
            name: d.name || "",
            hasAchievement: !!d.hasAchievement,
            dangerFlag: !!d.dangerFlag,
            friendFlag: !!d.friendFlag,
            ffFlag: !!d.ffFlag,
            notes: d.notes || "",
            deceased: !!d.deceased,
          };

          const isSameContent = (r) =>
            r.member === normalized.member &&
            r.poseName === normalized.poseName &&
            r.userName === normalized.userName &&
            r.name === normalized.name;

          let targetIndex = d.id ? working.findIndex((r) => r.id === d.id) : -1;
          if (targetIndex === -1) targetIndex = working.findIndex(isSameContent);

          if (targetIndex !== -1) {
            const existing = working[targetIndex];
            const changed = Object.keys(normalized).some((key) => existing[key] !== normalized[key]);
            if (changed) {
              working[targetIndex] = { ...existing, ...normalized };
              updatedCount++;
            } else {
              unchangedCount++;
            }
          } else {
            const idAvailable = d.id && !working.some((r) => r.id === d.id);
            working = [{ ...normalized, id: idAvailable ? d.id : makeId(), createdAt: d.createdAt || Date.now() }, ...working];
            addedCount++;
          }
        });

        onImport(working);
        setMessage(`✅ 追加${addedCount}件 ／ 更新${updatedCount}件 ／ 変更なし${unchangedCount}件`);
      } catch (err) {
        setMessage("❌ 読み込みに失敗しました。JSONファイルを確認してください。");
      }
      if (fileRef.current) fileRef.current.value = "";
    };
    reader.readAsText(file);
  };

  return (
    <div>
      <h2 className="section-title" style={{ fontFamily: "'M PLUS Rounded 1c', sans-serif", color: DEFAULT_THEME.text, marginBottom: "0.85rem" }}>データ管理 💾</h2>
      <div className="io-card">
        <h3 className="io-card-title">エクスポート</h3>
        <p className="io-card-desc">今のデータ（{records.length}けん）をJSONファイルとして保存します。</p>
        <button onClick={handleExport} className="btn-export" style={{ background: DEFAULT_THEME.accent }}>⬇️ エクスポートする</button>
      </div>
      <div className="io-card">
        <h3 className="io-card-title">メンバーを選んでエクスポート</h3>
        <p className="io-card-desc">選んだメンバーのデータだけをJSONファイルとして保存します。</p>
        <select value={exportMember} onChange={(e) => setExportMember(e.target.value)} className="form-select" style={{ borderColor: DEFAULT_THEME.accentSoft }}>
          {MEMBERS.map((m) => (
            <option key={m.key} value={m.key}>{m.emoji} {m.label}（{m.colorName}）</option>
          ))}
        </select>
        <button onClick={handleExportByMember} className="btn-export" style={{ background: MEMBERS.find((m) => m.key === exportMember).accent }}>⬇️ このメンバーだけエクスポート</button>
      </div>
      <div className="io-card">
        <h3 className="io-card-title">保存した取引をエクスポート</h3>
        <p className="io-card-desc">「確定」タブで保存した過去の取引から、選んだものだけをJSONファイルとして保存します。</p>
        {archives.length === 0 && <p className="trade-empty">まだ保存された取引がありません</p>}
        {archives.map((a) => (
          <label key={a.id} className="checkbox-label" style={{ display: "flex", marginBottom: "0.3rem" }}>
            <input type="checkbox" checked={selectedArchiveIds.includes(a.id)} onChange={() => toggleArchiveSelection(a.id)} />
            {a.title}　<span style={{ color: "var(--gray-400)", fontWeight: 400 }}>{new Date(a.savedAt).toLocaleDateString("ja-JP")}</span>
          </label>
        ))}
        {archives.length > 0 && (
          <button onClick={handleExportArchives} className="btn-export" style={{ background: "#8B5CF6", marginTop: "0.3rem" }}>⬇️ 選んだ取引をエクスポート</button>
        )}
      </div>
      <div className="io-card">
        <h3 className="io-card-title">インポート</h3>
        <p className="io-card-desc">JSONファイルを選んでデータを読み込みます（既存データに追加されます）。</p>
        <input ref={fileRef} type="file" accept="application/json" onChange={handleFileChange} />
      </div>
      <div className="io-card">
        <h3 className="io-card-title">全データ削除</h3>
        <p className="io-card-desc">すべてのデータを削除します。この操作は取り消せません。</p>
        <button onClick={onClearAll} className="btn-danger-outline">🗑️ 全部削除する</button>
      </div>
      {message && <p className="io-message">{message}</p>}
    </div>
  );
}

function TradeItemRow({ item, listKey, matches, otherItems, allPoseNames, onDeleteItem, onConfirm, onComplete, onUpdateInfo, onSetLinked, onClearLinked, onSetHoldFor, onSetSecondaryWant, onConfirmLinkedPair }) {
  const m = MEMBERS.find((mm) => mm.key === item.member) || MEMBERS[0];
  const [editing, setEditing] = useState(false);
  const [mode, setMode] = useState("exchange");
  const [exMember, setExMember] = useState(MEMBERS[0].key);
  const [exPose, setExPose] = useState("");
  const [amount, setAmount] = useState(1);
  const [partnerChoice, setPartnerChoice] = useState(() => (matches.length > 0 ? matches[0].id : "custom"));
  const [customUserName, setCustomUserName] = useState("");
  const [customName, setCustomName] = useState("");
  const [linking, setLinking] = useState(false);

  const [editingInfo, setEditingInfo] = useState(false);
  const [infoChoice, setInfoChoice] = useState(() => {
    if (item.userName || item.name) {
      const found = matches.find((mt) => mt.userName === item.userName && mt.name === item.name);
      if (found) return found.id;
      return "custom";
    }
    return matches.length > 0 ? matches[0].id : "custom";
  });
  const [infoUserName, setInfoUserName] = useState(item.userName || "");
  const [infoName, setInfoName] = useState(item.name || "");

  const [holding, setHolding] = useState(false);
  const [holdSelected, setHoldSelected] = useState(() => (item.holdFor || []).map((h) => h.key));
  const [holdCustoms, setHoldCustoms] = useState(() => (item.holdFor || []).filter((h) => h.type === "custom"));
  const [holdCustomUserName, setHoldCustomUserName] = useState("");
  const [holdCustomName, setHoldCustomName] = useState("");

  const [addingSecondary, setAddingSecondary] = useState(false);
  const [secMember, setSecMember] = useState(MEMBERS[0].key);
  const [secPose, setSecPose] = useState("");
  const [secShowSuggestions, setSecShowSuggestions] = useState(false);
  const secSuggestions = useMemo(() => getSuggestions(secPose, allPoseNames || []), [secPose, allPoseNames]);

  const otherListLabel = listKey === "got" ? "探してるものリスト" : "持っているものリスト";
  const isHeld = listKey === "got" && (item.holdFor || []).length > 0;

  const exchangePlaceholder = "交換するハピカ";
  const priceSuffix = listKey === "want" ? "で買い取る" : "で譲る";

  const linkedItem = item.linkedId ? otherItems.find((o) => o.id === item.linkedId) : null;
  const linkedDisplay = linkedItem
    ? item.linkedVariant === "secondary" && linkedItem.secondaryWant
      ? linkedItem.secondaryWant
      : { member: linkedItem.member, poseName: linkedItem.poseName }
    : null;

  const handleSaveInfo = () => {
    let userName = "";
    let name = "";
    if (infoChoice === "custom") {
      userName = infoUserName.trim();
      name = infoName.trim();
    } else {
      const match = matches.find((mt) => mt.id === infoChoice);
      userName = match ? match.userName : "";
      name = match ? match.name : "";
    }
    onUpdateInfo(listKey, item.id, { userName, name });
    setEditingInfo(false);
  };

  const handleSaveConfirm = () => {
    let partnerUserName = "";
    let partnerName = "";
    if (partnerChoice === "custom") {
      partnerUserName = customUserName.trim();
      partnerName = customName.trim();
    } else {
      const match = matches.find((mm) => mm.id === partnerChoice);
      partnerUserName = match ? match.userName : "";
      partnerName = match ? match.name : "";
    }

    if (mode === "exchange") {
      if (!exPose.trim()) {
        alert(`${exchangePlaceholder}を入力してください`);
        return;
      }
      onConfirm(listKey, item.id, { mode: "exchange", member: exMember, poseName: exPose.trim(), partnerUserName, partnerName });
    } else {
      onConfirm(listKey, item.id, { mode: "price", amount, partnerUserName, partnerName });
    }
    setEditing(false);
    setExPose("");
    setAmount(1);
  };

  const handlePickLink = (candidate) => {
    onSetLinked(listKey, item.id, candidate.id, candidate.variant || "primary");
    setLinking(false);
  };

  const handleClearLink = () => {
    onClearLinked(listKey, item.id);
    setLinking(false);
  };

  const linkCandidates = useMemo(() => {
    const flat = [];
    otherItems.forEach((o) => {
      flat.push({ refId: `${o.id}-primary`, id: o.id, member: o.member, poseName: o.poseName, variant: "primary" });
      if (listKey === "got" && o.secondaryWant) {
        flat.push({ refId: `${o.id}-secondary`, id: o.id, member: o.secondaryWant.member, poseName: o.secondaryWant.poseName, variant: "secondary" });
      }
    });
    return flat;
  }, [otherItems, listKey]);

  const toggleHoldMatch = (key) => {
    setHoldSelected((prev) => (prev.includes(key) ? prev.filter((k) => k !== key) : [...prev, key]));
  };

  const addHoldCustom = () => {
    if (!holdCustomUserName.trim() && !holdCustomName.trim()) return;
    setHoldCustoms((prev) => [...prev, { type: "custom", userName: holdCustomUserName.trim(), name: holdCustomName.trim() }]);
    setHoldCustomUserName("");
    setHoldCustomName("");
  };

  const removeHoldCustom = (idx) => {
    setHoldCustoms((prev) => prev.filter((_, i) => i !== idx));
  };

  const handleSaveHold = () => {
    const fromMatches = matches
      .filter((mt) => holdSelected.includes(mt.id))
      .map((mt) => ({ type: "match", key: mt.id, userName: mt.userName, name: mt.name }));
    let finalCustoms = holdCustoms;
    if (holdCustomUserName.trim() || holdCustomName.trim()) {
      finalCustoms = [...finalCustoms, { type: "custom", userName: holdCustomUserName.trim(), name: holdCustomName.trim() }];
    }
    onSetHoldFor(item.id, [...fromMatches, ...finalCustoms]);
    setHolding(false);
    setHoldCustomUserName("");
    setHoldCustomName("");
  };

  const handleSaveSecondary = () => {
    if (!secPose.trim()) {
      alert("ポーズ名を入力してください");
      return;
    }
    onSetSecondaryWant(item.id, { member: secMember, poseName: secPose.trim() });
    setAddingSecondary(false);
    setSecPose("");
  };

  const handleClearSecondary = () => {
    onSetSecondaryWant(item.id, null);
    setAddingSecondary(false);
  };

  return (
    <div className="trade-row-wrap">
      <div className="trade-row" style={{ borderLeftColor: m.accent, background: isHeld ? m.accentSoft : undefined }}>
        <span className="trade-row-member" style={{ color: m.text }}>{m.emoji}{m.label}</span>
        <span className="trade-row-pose">{item.poseName}</span>
        <div className="trade-row-btns">
          {listKey === "got" && (
            <button onClick={() => setHolding((v) => !v)} className="trade-mini-btn trade-mini-btn--hold">🔖 取置</button>
          )}
          {listKey === "want" && (
            <button onClick={() => setEditingInfo((v) => !v)} className="trade-mini-btn trade-mini-btn--edit">編集</button>
          )}
          {listKey === "want" && (
            <button onClick={() => setAddingSecondary((v) => !v)} className="trade-mini-btn trade-mini-btn--secondary">＋</button>
          )}
          <button onClick={() => setEditing((v) => !v)} className="trade-mini-btn trade-mini-btn--confirm">確定</button>
          <button onClick={() => onComplete(listKey, item.id)} className="trade-mini-btn trade-mini-btn--done">済</button>
          <button onClick={() => onDeleteItem(listKey, item.id)} className="trade-row-del">✕</button>
        </div>
      </div>

      {listKey === "got" && (item.holdFor || []).length > 0 && !holding && (
        <div className="trade-info-line">🔖 取り置き中：{(item.holdFor || []).map((h) => h.userName || h.name || "-").join(" ／ ")}</div>
      )}

      {holding && (
        <div className="trade-confirm-editor">
          <label className="trade-partner-label">誰のために取り置きますか（複数選択可）</label>
          {matches.length === 0 && <p className="trade-partner-display">候補がありません</p>}
          {matches.map((mt) => (
            <label key={mt.id} className="checkbox-label" style={{ display: "flex", marginBottom: "0.2rem" }}>
              <input type="checkbox" checked={holdSelected.includes(mt.id)} onChange={() => toggleHoldMatch(mt.id)} />
              {mt.userName || "-"} ／ {mt.name || "-"}
            </label>
          ))}
          {holdCustoms.map((c, idx) => (
            <div key={idx} className="trade-confirm-row" style={{ marginTop: "0.2rem" }}>
              <span className="trade-confirm-pose">{c.userName || "-"} ／ {c.name || "-"}</span>
              <button onClick={() => removeHoldCustom(idx)} className="trade-row-del">✕</button>
            </div>
          ))}
          <div className="trade-partner-custom-row" style={{ marginTop: "0.3rem" }}>
            <input value={holdCustomUserName} onChange={(e) => setHoldCustomUserName(e.target.value)} placeholder="ユーザー名" />
            <input value={holdCustomName} onChange={(e) => setHoldCustomName(e.target.value)} placeholder="名前" />
          </div>
          <button onClick={addHoldCustom} className="trade-restore-btn" style={{ marginBottom: "0.35rem" }}>＋ 自由入力を追加</button>
          <button onClick={handleSaveHold} className="btn-save-mini">この内容で取り置く</button>
        </div>
      )}

      {listKey === "want" && (item.userName || item.name) && !editingInfo && (
        <div className="trade-info-line">👤 {item.userName || "-"} ／ 📛 {item.name || "-"}</div>
      )}

      {editingInfo && (
        <div className="trade-confirm-editor">
          <label className="trade-partner-label">求めている人</label>
          {matches.length > 0 ? (
            <select value={infoChoice} onChange={(e) => setInfoChoice(e.target.value)} className="trade-partner-select">
              {matches.map((mt) => (
                <option key={mt.id} value={mt.id}>{mt.userName || "-"} ／ {mt.name || "-"}</option>
              ))}
              <option value="custom">その他（自由入力）</option>
            </select>
          ) : (
            <p className="trade-partner-display">候補なし（自由入力してください）</p>
          )}
          {infoChoice === "custom" && (
            <div className="trade-partner-custom-row">
              <input value={infoUserName} onChange={(e) => setInfoUserName(e.target.value)} placeholder="ユーザー名" />
              <input value={infoName} onChange={(e) => setInfoName(e.target.value)} placeholder="名前" />
            </div>
          )}
          <button onClick={handleSaveInfo} className="btn-save-mini">保存する</button>
        </div>
      )}

      {listKey === "want" && item.secondaryWant && !addingSecondary && (
        <div className="trade-info-line">
          ➕ {MEMBERS.find((mm) => mm.key === item.secondaryWant.member)?.emoji}{MEMBERS.find((mm) => mm.key === item.secondaryWant.member)?.colorName} {item.secondaryWant.poseName}
        </div>
      )}

      {addingSecondary && (
        <div className="trade-confirm-editor">
          <label className="trade-partner-label">さらに探しているもの</label>
          <div className="trade-input-row">
            <select value={secMember} onChange={(e) => setSecMember(e.target.value)} className="trade-select">
              {MEMBERS.map((mm) => (
                <option key={mm.key} value={mm.key}>{mm.emoji}{mm.label}</option>
              ))}
            </select>
            <input
              value={secPose}
              onChange={(e) => { setSecPose(e.target.value); setSecShowSuggestions(true); }}
              onFocus={() => setSecShowSuggestions(true)}
              placeholder="ポーズ名"
              className="trade-input"
            />
          </div>
          {secShowSuggestions && secSuggestions.length > 0 && (
            <div className="suggestion-list" style={{ marginBottom: "0.35rem" }}>
              {secSuggestions.map((s) => (
                <button key={s} type="button" onClick={() => { setSecPose(s); setSecShowSuggestions(false); }} className="suggestion-chip">{s}</button>
              ))}
            </div>
          )}
          <button onClick={handleSaveSecondary} className="btn-save-mini">追加する</button>
          {item.secondaryWant && (
            <button onClick={handleClearSecondary} className="trade-restore-btn" style={{ marginLeft: "0.4rem" }}>削除</button>
          )}
        </div>
      )}

      {editing && (
        <div className="trade-confirm-editor">
          <div className="trade-mode-row">
            <button type="button" onClick={() => setMode("exchange")} className={`filter-toggle${mode === "exchange" ? " active" : ""}`}>🔁 交換</button>
            <button type="button" onClick={() => setMode("price")} className={`filter-toggle${mode === "price" ? " active" : ""}`}>💰 定価</button>
            <button type="button" onClick={() => setLinking((v) => !v)} className={`trade-mini-btn trade-mini-btn--link${item.linkedId ? " active" : ""}`}>🔺</button>
          </div>

          {linking && (
            <div className="trade-confirm-editor" style={{ background: "#fff" }}>
              <label className="trade-partner-label">{otherListLabel}から選ぶ</label>
              {linkCandidates.length === 0 && <p className="trade-partner-display">候補がありません</p>}
              <div className="trade-link-candidates">
                {linkCandidates.map((o) => {
                  const om = MEMBERS.find((mm) => mm.key === o.member) || MEMBERS[0];
                  return (
                    <button key={o.refId} type="button" onClick={() => handlePickLink(o)} className="trade-link-candidate" style={{ borderColor: om.accentSoft }}>
                      {o.variant === "secondary" ? "➕ " : ""}{om.emoji}{om.colorName} {o.poseName}
                    </button>
                  );
                })}
              </div>
              {item.linkedId && (
                <button onClick={handleClearLink} className="trade-restore-btn" style={{ marginTop: "0.3rem" }}>リンク解除</button>
              )}
            </div>
          )}

          {linkedItem && !linking && (
            <div className="trade-info-line" style={{ marginLeft: 0, marginBottom: "0.35rem" }}>
              🔺 {MEMBERS.find((mm) => mm.key === linkedDisplay.member)?.emoji}{MEMBERS.find((mm) => mm.key === linkedDisplay.member)?.colorName} {linkedDisplay.poseName}　とリンク中
              <button onClick={() => onConfirmLinkedPair(listKey, item.id)} className="trade-mini-btn trade-mini-btn--confirm" style={{ marginLeft: "0.4rem" }}>確定リストへ（両方）</button>
            </div>
          )}

          {mode === "exchange" ? (
            <div className="trade-input-row">
              <select value={exMember} onChange={(e) => setExMember(e.target.value)} className="trade-select">
                {MEMBERS.map((mm) => (
                  <option key={mm.key} value={mm.key}>{mm.emoji}{mm.label}</option>
                ))}
              </select>
              <input value={exPose} onChange={(e) => setExPose(e.target.value)} placeholder={exchangePlaceholder} className="trade-input" />
            </div>
          ) : (
            <div className="trade-amount-row">
              <button type="button" onClick={() => setAmount((a) => Math.max(0, a - 1))} className="trade-amount-btn">－</button>
              <span className="trade-amount-value">+{amount}枚{priceSuffix}</span>
              <button type="button" onClick={() => setAmount((a) => a + 1)} className="trade-amount-btn">＋</button>
            </div>
          )}

          <div className="trade-partner-block">
            <label className="trade-partner-label">交換相手</label>
            {matches.length > 0 ? (
              <select value={partnerChoice} onChange={(e) => setPartnerChoice(e.target.value)} className="trade-partner-select">
                {matches.map((mt) => (
                  <option key={mt.id} value={mt.id}>{mt.userName || "-"} ／ {mt.name || "-"}</option>
                ))}
                <option value="custom">その他（自分で入力）</option>
              </select>
            ) : (
              <p className="trade-partner-display">候補なし（自分で入力してください）</p>
            )}
            {partnerChoice === "custom" && (
              <div className="trade-partner-custom-row">
                <input value={customUserName} onChange={(e) => setCustomUserName(e.target.value)} placeholder="ユーザー名" />
                <input value={customName} onChange={(e) => setCustomName(e.target.value)} placeholder="名前" />
              </div>
            )}
          </div>

          <button onClick={handleSaveConfirm} className="btn-save-mini">この内容で確定する</button>
        </div>
      )}

      {matches.map((rec) => (
        <div key={rec.id} className="trade-match">
          🙋 求めている人：{rec.userName || "-"}<CopyUserNameButton userName={rec.userName} /> ／ {rec.name || "-"}
          {(rec.hasAchievement || rec.friendFlag || rec.ffFlag || rec.dangerFlag) && (
            <span style={{ marginLeft: "0.35rem" }}>
              {rec.hasAchievement && "🏆"}
              {rec.friendFlag && "🤝"}
              {rec.ffFlag && "🔁"}
              {rec.dangerFlag && "⚠️"}
            </span>
          )}
        </div>
      ))}
    </div>
  );
}

function TradeSection({ title, emoji, listKey, items, otherItems, records, allPoseNames, onAdd, onDeleteItem, onConfirm, onComplete, onUpdateInfo, onSetLinked, onClearLinked, onSetHoldFor, onSetSecondaryWant, onConfirmLinkedPair }) {
  const [member, setMember] = useState(MEMBERS[0].key);
  const [poseName, setPoseName] = useState("");
  const [showSuggestions, setShowSuggestions] = useState(false);
  const inputRef = useRef(null);
  const theme = MEMBERS.find((m) => m.key === member);
  const suggestions = useMemo(() => getSuggestions(poseName, allPoseNames), [poseName, allPoseNames]);

  const handleAdd = () => {
    if (!poseName.trim()) return;
    onAdd(listKey, { member, poseName: poseName.trim() });
    setPoseName("");
    setShowSuggestions(false);
    if (inputRef.current) inputRef.current.focus();
  };

  const handleKeyDown = (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      handleAdd();
    }
  };

  const findMatches = (item) =>
    records.filter((r) => r.member === item.member && r.poseName.trim().toLowerCase() === item.poseName.trim().toLowerCase());

  const memberOrderIndex = (key) => MEMBERS.findIndex((m) => m.key === key);
  const sortByMember = (arr) => [...arr].sort((a, b) => memberOrderIndex(a.member) - memberOrderIndex(b.member));

  const displayItems = listKey === "want" ? sortByMember(items) : items;

  return (
    <div className="trade-section">
      <h3 className="trade-section-title">{emoji} {title}</h3>
      <div className="trade-input-row">
        <select value={member} onChange={(e) => setMember(e.target.value)} className="trade-select" style={{ borderColor: theme.accentSoft }}>
          {MEMBERS.map((m) => (
            <option key={m.key} value={m.key}>{m.emoji} {m.label}</option>
          ))}
        </select>
        <input
          ref={inputRef}
          value={poseName}
          onChange={(e) => { setPoseName(e.target.value); setShowSuggestions(true); }}
          onFocus={() => setShowSuggestions(true)}
          onKeyDown={handleKeyDown}
          placeholder="ポーズ名を入力してEnter"
          className="trade-input"
          style={{ borderColor: theme.accentSoft }}
        />
        <button onClick={handleAdd} className="trade-add-btn" style={{ background: theme.accent }}>＋</button>
      </div>
      {showSuggestions && suggestions.length > 0 && (
        <div className="suggestion-list" style={{ marginBottom: "0.4rem" }}>
          {suggestions.map((s) => (
            <button
              key={s}
              type="button"
              onClick={() => { setPoseName(s); setShowSuggestions(false); if (inputRef.current) inputRef.current.focus(); }}
              className="suggestion-chip"
              style={{ background: theme.accentSoft, color: theme.text }}
            >
              {s}
            </button>
          ))}
        </div>
      )}

      {items.length === 0 && <p className="trade-empty">まだありません</p>}
      <div className="trade-list">
        {displayItems.map((item) => (
          <TradeItemRow
            key={item.id}
            item={item}
            listKey={listKey}
            matches={findMatches(item)}
            otherItems={otherItems}
            allPoseNames={allPoseNames}
            onDeleteItem={onDeleteItem}
            onConfirm={onConfirm}
            onComplete={onComplete}
            onUpdateInfo={onUpdateInfo}
            onSetLinked={onSetLinked}
            onClearLinked={onClearLinked}
            onSetHoldFor={onSetHoldFor}
            onSetSecondaryWant={onSetSecondaryWant}
            onConfirmLinkedPair={onConfirmLinkedPair}
          />
        ))}
      </div>
    </div>
  );
}

function TradePostOutput({ wantItems }) {
  const [output, setOutput] = useState("");
  const [copied, setCopied] = useState(false);

  const handleGenerate = () => {
    const memberOrderIndex = (key) => MEMBERS.findIndex((mm) => mm.key === key);
    const sorted = [...wantItems].sort((a, b) => memberOrderIndex(a.member) - memberOrderIndex(b.member));
    const lines = sorted.map((item) => {
      const m = MEMBERS.find((mm) => mm.key === item.member);
      let line = `△${m ? m.colorName : ""}　${item.poseName}`;
      if (item.secondaryWant) {
        const lm = MEMBERS.find((mm) => mm.key === item.secondaryWant.member);
        line += `　（△の△${lm ? lm.colorName : ""}　${item.secondaryWant.poseName}）`;
      }
      return line;
    });
    setOutput(lines.join("\n"));
    setCopied(false);
  };

  const handleCopy = async () => {
    if (!output) return;
    try {
      await navigator.clipboard.writeText(output);
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    } catch (e) {
      alert("コピーに失敗しました");
    }
  };

  return (
    <div className="trade-post-card">
      <h3 className="io-card-title">📮 ポスト用出力</h3>
      <p className="io-card-desc">「探してるものリスト」の内容をテキスト化します。</p>
      <button onClick={handleGenerate} className="btn-export" style={{ background: DEFAULT_THEME.accent }}>出力する</button>
      {output && (
        <>
          <textarea readOnly value={output} className="trade-output-area" rows={Math.min(12, output.split("\n").length + 1)} />
          <button onClick={handleCopy} className="btn-export" style={{ background: "#6FB3EE" }}>{copied ? "✅ コピーしました" : "📋 コピーする"}</button>
        </>
      )}
    </div>
  );
}

      <h3 className="trade-section-title">✅ 取引済みリスト</h3>

      <div className="trade-list">
        {doneItems.map((it) => {
          const m = MEMBERS.find((mm) => mm.key === it.member) || MEMBERS[0];
          const label = formatConfirmLabel(it.origin, it.confirm);

                <span className="trade-row-pose">{it.poseName}</span>
                <span className="trade-done-origin">{it.origin === "got" ? "🎯" : "🔍"}</span>
                <button onClick={() => onRestoreDone(it.id)} className="trade-restore-btn">↩️ 戻す</button>
                <button onClick={() => onDeleteDone(it.id)} className="trade-row-del">✕</button>

function ArchivePoseRow({ item }) {
  const m = MEMBERS.find((mm) => mm.key === item.member) || MEMBERS[0];

function getConfirmedGroups(items) {
  const groups = [];
  const seen = new Set();
  items.forEach((item) => {
    if (seen.has(item.id)) return;
    if (item.linkPairId) {
      const groupItems = items.filter((it) => it.linkPairId === item.linkPairId);
      groupItems.forEach((gi) => seen.add(gi.id));
      groups.push(groupItems);
    } else {
      seen.add(item.id);
      groups.push([item]);
    }
  });
  return groups;
}

function ConfirmedTab({ confirmedItems, onUpdate, onRestore, onComplete, onDelete, onMove, doneItems, onDeleteDone, onRestoreDone, archives, onSaveSession }) {
  const [title, setTitle] = useState("");
  const [showArchives, setShowArchives] = useState(false);
  const [selectedArchiveId, setSelectedArchiveId] = useState(null);

  const handleSave = () => {
    if (!window.confirm("今回の取引を保存して、本日の取引をリセットしますか？")) return;
    onSaveSession(title);
    setTitle("");
  };

  const selectedArchive = archives.find((a) => a.id === selectedArchiveId);

  const groups = useMemo(() => getConfirmedGroups(confirmedItems), [confirmedItems]);

  const handlePrintLabels = async () => {
    const checkedItems = confirmedItems.filter((it) => it.checked);
    if (checkedItems.length === 0) {
      alert("印刷するレコードにチェックを入れてください");
      return;
    }
    if (typeof ExcelJS === "undefined") {
      alert("ラベル印刷機能の読み込みに失敗しました。通信環境を確認してください。");
      return;
    }

    const formatShortDate = (isoDate) => {
      if (!isoDate) return "";
      const parts = isoDate.split("-");
      if (parts.length !== 3) return isoDate;
      const [, m, d] = parts;
      return `${parseInt(m, 10)}/${parseInt(d, 10)}`;
    };

    const workbook = new ExcelJS.Workbook();
    const sheet = workbook.addWorksheet("データ");
    sheet.columns = [
      { header: "日付", key: "date", width: 12 },
      { header: "アカウント", key: "account", width: 22 },
      { header: "枚数", key: "count", width: 10 },
    ];
    sheet.getRow(1).font = { bold: true };

    checkedItems.forEach((it) => {
      const count = it.confirm.mode === "exchange" ? 1 : it.confirm.amount + 1;
      sheet.addRow({ date: formatShortDate(it.date), account: it.confirm.partnerUserName || "", count });
    });

    const lastDataRow = checkedItems.length + 1;
    const totalRowNum = lastDataRow + 1;
    const totalRow = sheet.getRow(totalRowNum);
    totalRow.getCell(1).value = "合計";
    totalRow.getCell(3).value = { formula: `SUM(C2:C${lastDataRow})` };
    totalRow.font = { bold: true };

    const buffer = await workbook.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: "application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    const now = new Date();
    const dateStr = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, "0")}${String(now.getDate()).padStart(2, "0")}`;
    a.download = `label-print-${dateStr}.xlsx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  return (
    <div>
      <h2 className="section-title" style={{ fontFamily: "'M PLUS Rounded 1c', sans-serif", color: DEFAULT_THEME.text, marginBottom: "0.85rem" }}>確定リスト 📝</h2>

      <div className="trade-section">
        <label className="form-label">タイトル</label>
        <input value={title} onChange={(e) => setTitle(e.target.value)} placeholder="例：9/20の取引" className="form-input" style={{ borderColor: DEFAULT_THEME.accentSoft }} />
        <div style={{ display: "flex", gap: "0.5rem", flexWrap: "wrap" }}>
          <button onClick={handleSave} className="btn-export" style={{ background: DEFAULT_THEME.accent }}>💾 今回の取引を保存</button>
          <button onClick={() => { setShowArchives((v) => !v); setSelectedArchiveId(null); }} className="btn-export" style={{ background: "#8B5CF6" }}>📚 過去の取引を見る</button>
        </div>
      </div>

      {showArchives && (
        <div className="trade-section">
          {selectedArchive ? (
            <ArchiveDetailView archive={selectedArchive} onClose={() => setSelectedArchiveId(null)} />
          ) : (
            <>
              <h3 className="trade-section-title">📚 保存された取引</h3>
              {archives.length === 0 && <p className="trade-empty">まだ保存された取引がありません</p>}
              <div className="trade-list">
                {archives.map((a) => (
                  <button key={a.id} type="button" onClick={() => setSelectedArchiveId(a.id)} className="trade-link-candidate" style={{ width: "100%", marginBottom: "0.3rem" }}>
                    {a.title}　<span style={{ color: "var(--gray-400)", fontWeight: 400 }}>{new Date(a.savedAt).toLocaleDateString("ja-JP")}</span>
                  </button>
                ))}
              </div>
            </>
          )}
        </div>
      )}

      <div className="trade-section">
        {groups.length === 0 && <p className="trade-empty">まだありません</p>}
        <div className="trade-list">
          {groups.map((group, groupIdx) =>
            group.map((item) => (
              <ConfirmedItemRow
                key={item.id}
                item={item}
                onUpdate={onUpdate}
                onRestore={onRestore}
                onComplete={onComplete}
                onDelete={onDelete}
                onMoveUp={() => onMove(item.id, -1)}
                onMoveDown={() => onMove(item.id, 1)}
                isFirst={groupIdx === 0}
                isLast={groupIdx === groups.length - 1}
              />
            ))
          )}
        </div>
        <button onClick={handlePrintLabels} className="btn-export" style={{ background: "#6FB3EE", marginTop: "0.6rem" }}>🏷️ ラベルプリント（チェックしたものだけ）</button>
      </div>

      <TradeDoneList doneItems={doneItems} onDeleteDone={onDeleteDone} onRestoreDone={onRestoreDone} />
    </div>
  );
}

// ---------- メインアプリ ----------
function App() {
  const [records, setRecords] = useState(() => loadRecords());
  const [trades, setTrades] = useState(() => loadTrades());
  const [archives, setArchives] = useState(() => loadArchives());
  const [activeTab, setActiveTab] = useState("home");
  const [modalOpen, setModalOpen] = useState(false);
  const [editingRecord, setEditingRecord] = useState(null);

  const persist = (newRecords) => {
    setRecords(newRecords);
    saveRecords(newRecords);
  };

  const allPoseNames = useMemo(() => [...new Set(records.map((r) => r.poseName).filter(Boolean))], [records]);

  const handleSave = (data) => {
    let newRecords;
    if (data.id) {
      newRecords = records.map((r) => (r.id === data.id ? { ...r, ...data } : r));
    } else {
      const newRec = { ...data, id: makeId(), createdAt: Date.now() };
      newRecords = [newRec, ...records];
    }
    persist(newRecords);
    setModalOpen(false);
    setEditingRecord(null);
  };

  const handleDelete = (id) => {
    if (!window.confirm("このレコードを削除しますか？")) return;
    persist(records.filter((r) => r.id !== id));
  };

  const handleEdit = (record) => {
    setEditingRecord(record);
    setModalOpen(true);
  };

  const handleImport = (mergedRecords) => {
    persist(mergedRecords);
  };

  const handleDuplicate = (record) => {
    const newRec = { ...record, id: makeId(), poseName: "", createdAt: Date.now() };
    persist([newRec, ...records]);
  };

  const persistTrades = (newTrades) => {
    setTrades(newTrades);
    saveTrades(newTrades);
  };

  const persistArchives = (newArchives) => {
    setArchives(newArchives);
    saveArchives(newArchives);
  };

  const handleSaveTradeSession = (title) => {
    const finalTitle = title.trim() || `取引 ${new Date().toLocaleDateString("ja-JP")}`;
    const archive = { id: makeId(), title: finalTitle, savedAt: Date.now(), data: trades };
    persistArchives([archive, ...archives]);
    persistTrades({ got: [], want: [], confirmed: [], done: [] });
  };

  const handleAddTrade = (listKey, item) => {
    const newItem = { ...item, id: makeId(), createdAt: Date.now(), holdFor: [], userName: "", name: "", linkedId: null, linkedVariant: null, secondaryWant: null };
    persistTrades({ ...trades, [listKey]: [newItem, ...trades[listKey]] });
  };

  const handleDeleteTradeItem = (listKey, id) => {
    persistTrades({ ...trades, [listKey]: trades[listKey].filter((t) => t.id !== id) });
  };

  const handleUpdateTradeItemInfo = (listKey, id, info) => {
    const newList = trades[listKey].map((it) => (it.id === id ? { ...it, userName: info.userName, name: info.name } : it));
    persistTrades({ ...trades, [listKey]: newList });
  };

  const handleSetHoldFor = (id, holdFor) => {
    const newList = trades.got.map((it) => (it.id === id ? { ...it, holdFor } : it));
    persistTrades({ ...trades, got: newList });
  };

  const handleSetSecondaryWant = (id, secondaryWant) => {
    const newList = trades.want.map((it) => (it.id === id ? { ...it, secondaryWant } : it));
    persistTrades({ ...trades, want: newList });
  };

  const handleSetLinked = (listKey, id, otherId, variant) => {
    const otherKey = listKey === "got" ? "want" : "got";
    const newSelf = trades[listKey].map((it) => (it.id === id ? { ...it, linkedId: otherId, linkedVariant: variant || "primary" } : it));
    const newOther = trades[otherKey].map((it) => (it.id === otherId ? { ...it, linkedId: id } : it));
    persistTrades({ ...trades, [listKey]: newSelf, [otherKey]: newOther });
  };

  const handleClearLinked = (listKey, id) => {
    const item = trades[listKey].find((it) => it.id === id);
    if (!item) return;
    const otherKey = listKey === "got" ? "want" : "got";
    const newSelf = trades[listKey].map((it) => (it.id === id ? { ...it, linkedId: null, linkedVariant: null } : it));
    const newOther = item.linkedId ? trades[otherKey].map((it) => (it.id === item.linkedId ? { ...it, linkedId: null, linkedVariant: null } : it)) : trades[otherKey];
    persistTrades({ ...trades, [listKey]: newSelf, [otherKey]: newOther });
  };

  const handleConfirmTradeItem = (listKey, id, confirmDetail) => {
    const item = trades[listKey].find((it) => it.id === id);
    if (!item) return;
    const confirmedItem = {
      id: makeId(),
      origin: listKey,
      member: item.member,
      poseName: item.poseName,
      confirm: confirmDetail,
      date: "",
      checked: false,
      linkPairId: null,
      sequenceFlag: null,
      createdAt: Date.now(),
    };
    const newList = trades[listKey].filter((it) => it.id !== id);
    persistTrades({ ...trades, [listKey]: newList, confirmed: [confirmedItem, ...trades.confirmed] });
  };

  const handleConfirmLinkedPair = (listKey, id) => {
    const item = trades[listKey].find((it) => it.id === id);
    if (!item || !item.linkedId) return;
    const otherKey = listKey === "got" ? "want" : "got";
    const otherItem = trades[otherKey].find((it) => it.id === item.linkedId);
    if (!otherItem) return;

    const gotItem = listKey === "got" ? item : otherItem;
    const wantItem = listKey === "want" ? item : otherItem;
    const gotVariant = listKey === "got" ? item.linkedVariant : otherItem.linkedVariant;
    const wantPoseInfo = gotVariant === "secondary" && wantItem.secondaryWant ? wantItem.secondaryWant : { member: wantItem.member, poseName: wantItem.poseName };
    const partnerUserName = wantItem.userName || "";
    const partnerName = wantItem.name || "";
    const linkPairId = makeId();

    const gotConfirmed = {
      id: makeId(),
      origin: "got",
      member: gotItem.member,
      poseName: gotItem.poseName,
      confirm: { mode: "exchange", member: wantPoseInfo.member, poseName: wantPoseInfo.poseName, partnerUserName, partnerName },
      date: "",
      checked: false,
      linkPairId,
      sequenceFlag: null,
      createdAt: Date.now(),
    };
    const wantConfirmed = {
      id: makeId(),
      origin: "want",
      member: wantItem.member,
      poseName: wantItem.poseName,
      confirm: { mode: "exchange", member: gotItem.member, poseName: gotItem.poseName, partnerUserName, partnerName },
      date: "",
      checked: false,
      linkPairId,
      sequenceFlag: null,
      createdAt: Date.now(),
    };

    persistTrades({
      ...trades,
      got: trades.got.filter((it) => it.id !== gotItem.id),
      want: trades.want.filter((it) => it.id !== wantItem.id),
      confirmed: [gotConfirmed, wantConfirmed, ...trades.confirmed],
    });
  };

  const handleUpdateConfirmed = (id, updates) => {
    const newList = trades.confirmed.map((it) => (it.id === id ? { ...it, ...updates } : it));
    persistTrades({ ...trades, confirmed: newList });
  };

  const handleRestoreConfirmed = (id) => {
    const item = trades.confirmed.find((it) => it.id === id);
    if (!item) return;
    const restored = { id: makeId(), member: item.member, poseName: item.poseName, createdAt: Date.now(), holdFor: [], userName: "", name: "", linkedId: null, secondaryWant: null };
    const newConfirmed = trades.confirmed.filter((it) => it.id !== id);
    persistTrades({ ...trades, confirmed: newConfirmed, [item.origin]: [restored, ...trades[item.origin]] });
  };

  const handleCompleteConfirmed = (id) => {
    const item = trades.confirmed.find((it) => it.id === id);
    if (!item) return;
    const doneItem = { ...item, completedAt: Date.now() };
    const newConfirmed = trades.confirmed.filter((it) => it.id !== id);
    persistTrades({ ...trades, confirmed: newConfirmed, done: [doneItem, ...trades.done] });
  };

  const handleMoveConfirmed = (id, direction) => {
    const groups = getConfirmedGroups(trades.confirmed);
    const groupIdx = groups.findIndex((g) => g.some((it) => it.id === id));
    const targetIdx = groupIdx + direction;
    if (groupIdx === -1 || targetIdx < 0 || targetIdx >= groups.length) return;
    const newGroups = [...groups];
    [newGroups[groupIdx], newGroups[targetIdx]] = [newGroups[targetIdx], newGroups[groupIdx]];
    persistTrades({ ...trades, confirmed: newGroups.flat() });
  };

  const handleDeleteConfirmed = (id) => {
    persistTrades({ ...trades, confirmed: trades.confirmed.filter((it) => it.id !== id) });
  };

  const handleCompleteTradeItem = (listKey, id) => {
    const item = trades[listKey].find((it) => it.id === id);
    if (!item) return;
    const doneItem = { id: item.id, origin: listKey, member: item.member, poseName: item.poseName, confirm: null, date: "", completedAt: Date.now() };
    const newList = trades[listKey].filter((it) => it.id !== id);
    persistTrades({ ...trades, [listKey]: newList, done: [doneItem, ...trades.done] });
  };

  const handleDeleteDoneItem = (id) => {
    persistTrades({ ...trades, done: trades.done.filter((it) => it.id !== id) });
  };

  const handleRestoreDoneItem = (id) => {
    const item = trades.done.find((it) => it.id === id);
    if (!item) return;
    const newDone = trades.done.filter((it) => it.id !== id);
    if (item.confirm) {
      const restoredConfirmed = {
        id: item.id,
        origin: item.origin,
        member: item.member,
        poseName: item.poseName,
        confirm: item.confirm,
        date: item.date || "",
        checked: false,
        linkPairId: item.linkPairId || null,
        sequenceFlag: item.sequenceFlag || null,
        createdAt: Date.now(),
      };
      persistTrades({ ...trades, done: newDone, confirmed: [restoredConfirmed, ...trades.confirmed] });
    } else {
      const restored = { id: item.id, member: item.member, poseName: item.poseName, createdAt: Date.now(), holdFor: [], userName: "", name: "", linkedId: null, secondaryWant: null };
      persistTrades({ ...trades, done: newDone, [item.origin]: [restored, ...trades[item.origin]] });
    }
  };

  const handleClearAll = () => {
    if (!window.confirm("本当にすべてのデータを削除しますか？この操作は取り消せません。")) return;
    persist([]);
  };

  const theme = getTheme(activeTab);

  return (
    <div className="app-shell" style={{ background: `linear-gradient(180deg, ${theme.accentSoft} 0%, #FFFDFB 220px)` }}>
      <div className="container">
        <div className="header">
          <h1 className="app-title" style={{ fontFamily: "'M PLUS Rounded 1c', sans-serif", color: "#C24A6E" }}>求めリスト</h1>
          <p className="app-subtitle">かわいくポーズをきろくしよう</p>
        </div>

        <div className="tab-bar no-scrollbar">
          {TABS.map((t) => {
            const isActive = activeTab === t.key;
            const tTheme = getTheme(t.key);
            return (
              <button
                key={t.key}
                onClick={() => setActiveTab(t.key)}
                className="tab-btn"
                style={isActive ? { background: tTheme.accent, color: "#fff" } : { background: "#fff", color: tTheme.text, border: `2px solid ${tTheme.accentSoft}` }}
              >
                {t.emoji} {t.label}
              </button>
            );
          })}
        </div>

        {activeTab === "home" && (
          <HomeTab records={records} onDelete={handleDelete} onEdit={handleEdit} onDuplicate={handleDuplicate} onAddClick={() => { setEditingRecord(null); setModalOpen(true); }} />
        )}
        {activeTab === "search" && <SearchTab records={records} onDelete={handleDelete} onEdit={handleEdit} onDuplicate={handleDuplicate} />}
        {activeTab === "trades" && (
          <TradeTab
            records={records}
            trades={trades}
            onAdd={handleAddTrade}
            onDeleteItem={handleDeleteTradeItem}
            onConfirm={handleConfirmTradeItem}
            onComplete={handleCompleteTradeItem}
            onUpdateInfo={handleUpdateTradeItemInfo}
            onSetLinked={handleSetLinked}
            onClearLinked={handleClearLinked}
            onSetHoldFor={handleSetHoldFor}
            onSetSecondaryWant={handleSetSecondaryWant}
            onConfirmLinkedPair={handleConfirmLinkedPair}
          />
        )}
        {activeTab === "confirmed" && (
          <ConfirmedTab
            confirmedItems={trades.confirmed}
            onUpdate={handleUpdateConfirmed}
            onRestore={handleRestoreConfirmed}
            onComplete={handleCompleteConfirmed}
            onDelete={handleDeleteConfirmed}
            onMove={handleMoveConfirmed}
            doneItems={trades.done}
            onDeleteDone={handleDeleteDoneItem}
            onRestoreDone={handleRestoreDoneItem}
            archives={archives}
            onSaveSession={handleSaveTradeSession}
          />
        )}
        {activeTab === "io" && <IOTab records={records} onImport={handleImport} onClearAll={handleClearAll} archives={archives} />}
        {MEMBERS.map((m) => activeTab === m.key && (
          <MemberTab key={m.key} memberConfig={m} records={records} onDelete={handleDelete} onEdit={handleEdit} onDuplicate={handleDuplicate} />
        ))}
      </div>

      {modalOpen && (
        <RecordFormModal
          initial={editingRecord}
          allPoseNames={allPoseNames}
          onSave={handleSave}
          onCancel={() => { setModalOpen(false); setEditingRecord(null); }}
        />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
